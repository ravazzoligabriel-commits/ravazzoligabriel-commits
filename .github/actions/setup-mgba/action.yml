name: Build pinned mGBA
description: Build only the emulator core; never cache cartridges or game state
inputs:
  build-demo:
    description: Build the homebrew demo ROM (not needed for FireRed visitor turns)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - shell: bash
      run: python -m pip install -r requirements.txt
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      id: core
      with:
        path: runtime/core/mgba_libretro.so
        key: mgba-0.10.5-26b7884-ubuntu24-v1
    - if: steps.core.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends cmake ninja-build libpng-dev zlib1g-dev
        git clone --no-checkout https://github.com/mgba-emu/mgba.git runtime/source
        git -C runtime/source checkout --detach 26b7884bc25a5933960f3cdcd98bac1ae14d42e2
        cmake -S runtime/source -B runtime/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRETRO=ON \
          -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_GL=OFF \
          -DBUILD_TEST=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF -DUSE_SQLITE3=OFF
        cmake --build runtime/build --target mgba_libretro --parallel 2
        mkdir -p runtime/core
        cp runtime/build/mgba_libretro.so runtime/core/mgba_libretro.so
    - if: inputs.build-demo == 'true'
      shell: bash
      run: python homebrew/build.py runtime/demo.gba
