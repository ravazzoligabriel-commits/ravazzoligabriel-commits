name: Spark 1.3 smoke test

on:
  push:
    paths:
      - ".github/workflows/spark-smoke.yml"
  workflow_dispatch:

jobs:
  spark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: npm install --global opencode-ai

      - name: Show OpenCode version
        run: opencode --version

      - name: Run Muse Spark 1.3
        id: spark
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          {
            echo "model=opencode/muse-spark-1.3-contributor-free"
            echo "started_at=$(date -u +%FT%TZ)"
            echo
            opencode run --standalone \
              --model opencode/muse-spark-1.3-contributor-free \
              "Reply exactly with: SPARK_1_3_OK"
            code=$?
            echo
            echo "exit_code=$code"
            echo "finished_at=$(date -u +%FT%TZ)"
            exit "$code"
          } 2>&1 | tee spark-result.txt
          exit ${PIPESTATUS[0]}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-smoke-result
          path: spark-result.txt
          if-no-files-found: warn
