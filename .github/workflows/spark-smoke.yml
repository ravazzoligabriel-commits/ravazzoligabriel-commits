name: Spark 1.3 bridge

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  spark:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.actor == github.repository_owner && (startsWith(github.event.issue.title, '[spark]') || startsWith(github.event.issue.title, '[afterimage]')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.event.issue.title, '[afterimage]') && 'afterimage-lab' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: npm install --global opencode-ai

      - name: Show OpenCode version
        run: opencode --version

      - name: Build prompt
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            jq -r '.issue.body // "Reply exactly with: SPARK_BRIDGE_OK"' "$GITHUB_EVENT_PATH" > spark-prompt.txt
          else
            printf '%s\n' 'Reply exactly with: SPARK_BRIDGE_OK' > spark-prompt.txt
          fi
          echo "prompt_bytes=$(wc -c < spark-prompt.txt)"

      - name: Run Muse Spark 1.3
        shell: bash
        run: |
          set +e
          prompt="$(cat spark-prompt.txt)"
          {
            echo "model=opencode/muse-spark-1.3-contributor-free"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "auth=public-free-model"
            echo
            opencode run \
              --model opencode/muse-spark-1.3-contributor-free \
              "$prompt"
            code=$?
            echo
            echo "exit_code=$code"
            echo "finished_at=$(date -u +%FT%TZ)"
            exit "$code"
          } 2>&1 | tee spark-result.txt
          exit ${PIPESTATUS[0]}

      - name: Capture workspace changes
        if: always()
        shell: bash
        run: |
          git status --short > agent-status.txt || true
          git diff --binary -- afterimage > agent.patch || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-result-${{ github.run_id }}
          path: |
            spark-prompt.txt
            spark-result.txt
            agent-status.txt
            agent.patch
            afterimage/
          if-no-files-found: warn
