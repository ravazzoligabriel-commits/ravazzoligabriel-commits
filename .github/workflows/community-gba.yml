name: Community GBA turns
# Refresh the README console after the private renderer adds transparent corners and a GitHub mark.
on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      operator_plan:
        description: Apply reviewed private trainer preparation once
        type: boolean
        default: false
      restore_turn:
        description: 'Restore private checkpoint from before Issue number (leave blank for normal runs)'
        type: string
        default: ''
  push:
    branches: [feat/gitboy-private-runner, main]
    paths: ['.github/workflows/community-gba.yml']
permissions: {}
concurrency:
  group: community-gba
  cancel-in-progress: false
jobs:
  turns:
    if: >-
      github.repository == 'ravazzoligabriel-commits/ravazzoligabriel-commits' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.title, '[gba]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GBA_STATE_KEY: ${{ secrets.GBA_STATE_KEY }}
      GAME_MODE: ${{ vars.GBA_GAME_MODE || 'homebrew' }}
      PRIVATE_REPOSITORY: ${{ vars.GBA_PRIVATE_REPOSITORY }}
      PRIVATE_TOKEN: ${{ secrets.GBA_PRIVATE_TOKEN }}
      ROM_SHA256: ${{ vars.GBA_ROM_SHA256 }}
      PYTHONPATH: ${{ github.workspace }}/private
    steps:
      - name: Checkout public profile facade
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref_name }}
      - name: Checkout private engine, cartridge and encrypted state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.GBA_PRIVATE_REPOSITORY }}
          token: ${{ secrets.GBA_PRIVATE_TOKEN || github.token }}
          ssh-key: ${{ secrets.GBA_PRIVATE_SSH_KEY }}
          ref: main
          path: private
      - name: Validate private engine and encryption configuration
        shell: bash
        run: |
          test -f private/community/worker.py
          test ! -e community/worker.py
          python -c "from community.session import key_from_env; key_from_env()"
      - name: Build pinned emulator via private engine
        uses: ./private/.github/actions/setup-mgba
        with:
          engine-root: private
          build-demo: ${{ github.ref_name != github.event.repository.default_branch || env.GAME_MODE != 'firered' }}
      - name: Verify private emulator engine before public writes
        if: github.event_name != 'issues'
        env:
          MGBA_CORE: runtime/core/mgba_libretro.so
        run: python -m unittest discover -s private/tests -v
      - name: Verify private FireRed cartridge and continuation
        if: github.event_name != 'issues' && env.GAME_MODE == 'firered' && github.ref_name == github.event.repository.default_branch
        env:
          MGBA_CORE: runtime/core/mgba_libretro.so
          FIRERED_ROM: private/cartridge.gba
          GBA_DIAGNOSTICS_PUSH: 'true'
        run: python -m unittest discover -s private/tests -p test_firered.py -v
      - name: Process issue queue with private engine and publish public-only visuals
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref_name }}
          CANARY: ${{ github.ref_name != github.event.repository.default_branch }}
          OPERATOR_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_plan || false }}
          RESTORE_TURN: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_turn || '' }}
        run: |
          if [[ "$CANARY" == 'true' ]]; then
            python -m community.worker --core runtime/core/mgba_libretro.so --rom runtime/demo.gba --branch "$TARGET_BRANCH" --canary --publish
          elif [[ "$GAME_MODE" == 'firered' ]]; then
            python -m community.private_storage
            python -c "import hashlib,os; from pathlib import Path; assert len(os.environ['ROM_SHA256'])==64 and hashlib.sha256(Path('private/cartridge.gba').read_bytes()).hexdigest()==os.environ['ROM_SHA256'], 'Private ROM digest mismatch'"
            operator_args=()
            if [[ "$OPERATOR_PLAN" == 'true' ]]; then
              operator_args=(--operator-plan private/operator-plan.json)
            fi
            if [[ -n "$RESTORE_TURN" ]]; then
              if [[ ! "$RESTORE_TURN" =~ ^[1-9][0-9]*$ ]]; then
                echo 'Restore turn must be a positive Issue number' >&2; exit 1
              fi
              operator_args+=(--restore-turn "$RESTORE_TURN")
            fi
            python -m community.worker --core runtime/core/mgba_libretro.so --rom private/cartridge.gba --state-root private --state-branch main --branch "$TARGET_BRANCH" --mode firered --publish "${operator_args[@]}"
          else
            python -m community.worker --core runtime/core/mgba_libretro.so --rom runtime/demo.gba --branch "$TARGET_BRANCH" --publish
          fi
