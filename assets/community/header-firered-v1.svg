<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-labelledby="title desc">
  <title id="title">Play FireRed together</title>
  <desc id="desc">A real GBA adventure on GitHub. One shared save. Everyone takes a turn.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="0"><stop stop-color="#302638"/><stop offset="1" stop-color="#191c24"/></linearGradient>
    <clipPath id="ball"><circle cx="63" cy="60" r="30"/></clipPath>
  </defs>
  <rect x="1" y="1" width="878" height="118" rx="20" fill="url(#background)" stroke="#4c425d" stroke-width="2"/>
  <rect x="1" y="28" width="4" height="64" rx="2" fill="#eb6f75"/>
  <circle cx="63" cy="60" r="39" fill="#ed737a" opacity=".08"/>
  <g clip-path="url(#ball)">
    <circle cx="63" cy="60" r="30" fill="#dedde8"/>
    <path d="M30 27h66v33H30z" fill="#df626b"/>
    <path d="M31 60h64" stroke="#252333" stroke-width="7"/>
  </g>
  <circle cx="63" cy="60" r="30" fill="none" stroke="#252333" stroke-width="4"/>
  <circle cx="63" cy="60" r="10" fill="#f5f1f7" stroke="#252333" stroke-width="5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="120" y="28" fill="#c7a4cb" font-size="12" font-weight="700" letter-spacing="2.5">GITHUB COMMUNITY ADVENTURE</text>
    <text x="119" y="64" fill="#faf6ff" font-size="32" font-weight="800" letter-spacing=".5">PLAY FIRERED TOGETHER</text>
    <text x="120" y="94" fill="#c9c8d6" font-size="18">A real GBA adventure. One shared save. Everyone takes a turn.</text>
  </g>
  <g fill="#8f80b4" opacity=".3">
    <rect x="815" y="20" width="8" height="8"/><rect x="827" y="20" width="8" height="8"/>
    <rect x="827" y="32" width="8" height="8"/><rect x="839" y="32" width="8" height="8"/>
    <rect x="839" y="44" width="8" height="8"/>
  </g>
